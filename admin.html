<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پنل مدیریت - کلاس پایتون</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
:root {
  --bg: #0f172a;
  --card: #1e293b;
  --ink: #f1f5f9;
  --muted: #94a3b8;
  --line: #334155;
  --primary: #6366f1;
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Vazirmatn', sans-serif;
  min-height: 100vh;
  padding: 20px;
}

.login-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  z-index: 9999;
}

.login-box {
  background: var(--card);
  padding: 40px;
  border-radius: 20px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  max-width: 400px;
  width: 100%;
}

.login-box h1 {
  font-size: 28px;
  margin-bottom: 10px;
  text-align: center;
}

.login-box p {
  color: var(--muted);
  text-align: center;
  margin-bottom: 30px;
}

.login-box input {
  width: 100%;
  padding: 15px;
  border: 2px solid var(--line);
  border-radius: 10px;
  background: var(--bg);
  color: var(--ink);
  font-size: 16px;
  font-family: inherit;
  margin-bottom: 20px;
  text-align: center;
  font-weight: 600;
}

.login-box input:focus {
  outline: none;
  border-color: var(--primary);
}

.login-box button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--primary), #8b5cf6);
  color: white;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
}

.login-box button:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
}

.error-msg {
  color: var(--danger);
  text-align: center;
  margin-top: 15px;
  font-size: 14px;
}

.dashboard {
  display: none;
  max-width: 1400px;
  margin: 0 auto;
}

.dashboard.show {
  display: block;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
  padding-bottom: 20px;
  border-bottom: 2px solid var(--line);
}

.header h1 {
  font-size: 32px;
}

.logout-btn {
  padding: 10px 20px;
  border: 2px solid var(--danger);
  border-radius: 10px;
  background: transparent;
  color: var(--danger);
  cursor: pointer;
  font-family: inherit;
  font-weight: 600;
}

.logout-btn:hover {
  background: var(--danger);
  color: white;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--card);
  padding: 25px;
  border-radius: 15px;
  border: 2px solid var(--line);
}

.stat-card h3 {
  font-size: 14px;
  color: var(--muted);
  margin-bottom: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.stat-card .value {
  font-size: 48px;
  font-weight: 800;
  color: var(--primary);
}

.section {
  background: var(--card);
  padding: 30px;
  border-radius: 15px;
  border: 2px solid var(--line);
  margin-bottom: 30px;
}

.section h2 {
  font-size: 24px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.class-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 20px;
}

.class-card {
  background: var(--bg);
  padding: 20px;
  border-radius: 10px;
  border: 2px solid var(--line);
  transition: all 0.3s;
}

.class-card:hover {
  border-color: var(--primary);
  transform: translateY(-5px);
}

.class-card h3 {
  font-size: 18px;
  margin-bottom: 15px;
}

.class-code {
  display: inline-block;
  background: var(--primary);
  color: white;
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 10px;
}

.class-stats {
  display: flex;
  gap: 15px;
  margin-top: 15px;
  padding-top: 15px;
  border-top: 1px solid var(--line);
}

.class-stat {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.class-stat .num {
  font-size: 24px;
  font-weight: 700;
  color: var(--success);
}

.class-stat .label {
  font-size: 11px;
  color: var(--muted);
}

.team-list {
  display: grid;
  gap: 15px;
}

.team-item {
  background: var(--bg);
  padding: 15px 20px;
  border-radius: 10px;
  border-right: 4px solid;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.team-info {
  display: flex;
  align-items: center;
  gap: 15px;
}

.team-color {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: 700;
}

.team-name {
  font-size: 18px;
  font-weight: 600;
}

.team-meta {
  font-size: 13px;
  color: var(--muted);
  margin-top: 3px;
}

.team-stats {
  display: flex;
  gap: 20px;
}

.team-stat {
  text-align: center;
}

.team-stat .num {
  font-size: 20px;
  font-weight: 700;
}

.team-stat .label {
  font-size: 11px;
  color: var(--muted);
}

.loader {
  text-align: center;
  padding: 40px;
  color: var(--muted);
}

.spinner {
  width: 40px;
  height: 40px;
  border: 4px solid var(--line);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 15px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.refresh-btn {
  padding: 10px 20px;
  border: 2px solid var(--primary);
  border-radius: 10px;
  background: var(--primary);
  color: white;
  cursor: pointer;
  font-family: inherit;
  font-weight: 600;
  margin-left: 10px;
}

.refresh-btn:hover {
  background: #4f46e5;
}

.timestamp {
  color: var(--muted);
  font-size: 13px;
  margin-right: 10px;
}
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h1>🔐 پنل مدیریت</h1>
    <p>برای دسترسی به پنل مدیریت، رمز عبور را وارد کنید</p>
    <input type="password" id="passwordInput" placeholder="رمز عبور" autofocus>
    <button onclick="login()">ورود</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>
</div>

<div class="dashboard" id="dashboard">
  <div class="header">
    <div>
      <h1>📊 پنل مدیریت کلاس‌های پایتون</h1>
      <span class="timestamp" id="timestamp"></span>
    </div>
    <div>
      <button class="refresh-btn" onclick="loadData()">🔄 به‌روزرسانی</button>
      <button class="logout-btn" onclick="logout()">خروج</button>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <h3>تعداد کلاس‌ها</h3>
      <div class="value" id="totalSessions">0</div>
    </div>
    <div class="stat-card">
      <h3>تعداد تیم‌ها</h3>
      <div class="value" id="totalTeams">0</div>
    </div>
    <div class="stat-card">
      <h3>تعداد کدها</h3>
      <div class="value" id="totalCells">0</div>
    </div>
    <div class="stat-card">
      <h3>تعداد کامنت‌ها</h3>
      <div class="value" id="totalComments">0</div>
    </div>
  </div>

  <div class="section">
    <h2>📚 همه کلاس‌ها</h2>
    <div class="class-grid" id="classesList"></div>
  </div>

  <div class="section">
    <h2>👥 همه تیم‌ها</h2>
    <div class="team-list" id="teamsList"></div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

const SUPABASE_URL = 'https://fqwlbqpduxmpnlvxrmsy.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZxd2xicXBkdXhtcG5sdnhybXN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4MTUwNjEsImV4cCI6MjEwNTM5MTA2MX0.5qvPUi_grBuUgITLpG0-QShzLsLaiA07i7pWRtnsWPc';
const ADMIN_PASSWORD = 'admin2025';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const PALETTE = ['#6366f1','#8b5cf6','#ec4899','#f43f5e','#f59e0b','#10b981','#06b6d4','#3b82f6','#84cc16','#eab308'];

function colorOf(name) {
  let h = 0;
  const s = name || 'تیم';
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return PALETTE[h % PALETTE.length];
}

function initials(name) {
  const s = (name || '؟').trim();
  const parts = s.split(/\s+/);
  if (parts.length === 1) return parts[0].slice(0, 1).toUpperCase();
  return (parts[0][0] + parts[1][0]).toUpperCase();
}

window.login = function() {
  const password = document.getElementById('passwordInput').value;
  if (password === ADMIN_PASSWORD) {
    sessionStorage.setItem('adminAuth', 'true');
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').classList.add('show');
    loadData();
  } else {
    document.getElementById('errorMsg').textContent = 'رمز عبور اشتباه است';
  }
};

window.logout = function() {
  sessionStorage.removeItem('adminAuth');
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('dashboard').classList.remove('show');
  document.getElementById('passwordInput').value = '';
  document.getElementById('errorMsg').textContent = '';
};

window.loadData = async function() {
  try {
    document.getElementById('timestamp').textContent = 'در حال بارگذاری...';

    const { data: sessions, error: sessionsError } = await supabase
      .from('sessions')
      .select('*')
      .order('created_at', { ascending: false });

    if (sessionsError) throw sessionsError;

    const { data: teams, error: teamsError } = await supabase
      .from('teams')
      .select('*')
      .order('created_at', { ascending: false });

    if (teamsError) throw teamsError;

    const { data: cells, error: cellsError } = await supabase
      .from('cells')
      .select('*');

    if (cellsError) throw cellsError;

    const { data: comments, error: commentsError } = await supabase
      .from('comments')
      .select('*');

    if (commentsError) throw commentsError;

    document.getElementById('totalSessions').textContent = sessions?.length || 0;
    document.getElementById('totalTeams').textContent = teams?.length || 0;
    document.getElementById('totalCells').textContent = cells?.length || 0;
    document.getElementById('totalComments').textContent = comments?.length || 0;

    renderClasses(sessions, teams, cells);
    renderTeams(teams, sessions, cells);

    const now = new Date();
    document.getElementById('timestamp').textContent = 
      `آخرین به‌روزرسانی: ${now.toLocaleTimeString('fa-IR')}`;

  } catch (error) {
    console.error('Error loading data:', error);
    alert('خطا در بارگذاری اطلاعات: ' + error.message);
  }
};

function renderClasses(sessions, teams, cells) {
  const container = document.getElementById('classesList');
  
  if (!sessions || sessions.length === 0) {
    container.innerHTML = '<div class="loader">هیچ کلاسی یافت نشد</div>';
    return;
  }

  container.innerHTML = sessions.map(session => {
    const sessionTeams = teams?.filter(t => t.session_id === session.id) || [];
    const sessionCells = cells?.filter(c => c.session_id === session.id) || [];
    
    return `
      <div class="class-card">
        <h3>${session.title || 'بدون نام'}</h3>
        <span class="class-code">${session.code}</span>
        <div style="color: var(--muted); font-size: 12px; margin-top: 5px;">
          ایجاد شده: ${new Date(session.created_at).toLocaleDateString('fa-IR')}
        </div>
        <div class="class-stats">
          <div class="class-stat">
            <div class="num">${sessionTeams.length}</div>
            <div class="label">تیم</div>
          </div>
          <div class="class-stat">
            <div class="num">${sessionCells.length}</div>
            <div class="label">کد</div>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function renderTeams(teams, sessions, cells) {
  const container = document.getElementById('teamsList');
  
  if (!teams || teams.length === 0) {
    container.innerHTML = '<div class="loader">هیچ تیمی یافت نشد</div>';
    return;
  }

  container.innerHTML = teams.map(team => {
    const teamCells = cells?.filter(c => c.team_id === team.id) || [];
    const session = sessions?.find(s => s.id === team.session_id);
    const color = team.color || colorOf(team.name);
    const members = team.members || [];
    
    return `
      <div class="team-item" style="border-color: ${color}">
        <div class="team-info">
          <div class="team-color" style="background: ${color}">
            ${initials(team.name)}
          </div>
          <div>
            <div class="team-name">${team.name}</div>
            <div class="team-meta">
              کلاس: ${session?.title || 'نامشخص'} • 
              ${members.length} عضو
            </div>
          </div>
        </div>
        <div class="team-stats">
          <div class="team-stat">
            <div class="num">${teamCells.length}</div>
            <div class="label">کد</div>
          </div>
          <div class="team-stat">
            <div class="num">${members.length}</div>
            <div class="label">عضو</div>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

if (sessionStorage.getItem('adminAuth') === 'true') {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('dashboard').classList.add('show');
  loadData();
}

document.getElementById('passwordInput')?.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') login();
});
</script>

</body>
</html>
