  const tests = Array.isArray(ex.test_cases) ? ex.test_cases : [];

  let resultsHtml = '';
  if (testResults.length) {
    resultsHtml = `<h3 style="font-size:14px;color:var(--muted);margin:16px 0 10px">🧪 نتایج تست‌ها</h3>` +
      testResults.map((r, i) => `
        <div class="test-result-row ${r.passed ? 'pass' : 'fail'}">
          <div class="test-result-head">
            <div class="test-result-num">
              <span style="background:${r.passed ? 'var(--success)' : 'var(--danger)'};color:white;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800">${i + 1}</span>
              تست ${i + 1}
            </div>
            <span class="test-result-status">${r.passed ? '✓ پاس' : '✗ ناموفق'}</span>
          </div>
          <div class="tc-compare">
            <div class="tc-col input"><div class="label">ورودی</div><div class="value">${escapeHtml(r.input || '(خالی)')}</div></div>
            <div class="tc-col expected"><div class="label">انتظار</div><div class="value">${escapeHtml(r.expected || '(خالی)')}</div></div>
            <div class="tc-col actual"><div class="label">خروجی</div><div class="value">${escapeHtml(r.actual || '(خالی)')}</div></div>
          </div>
        </div>`).join('');
  } else if (tests.length) {
    resultsHtml = `<div class="empty" style="padding:16px">نتایج تست‌ها ذخیره نشده</div>`;
  }

  const body = `
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px">
      <div class="sub-avatar" style="background:${color};width:56px;height:56px;font-size:20px">${escapeHtml(initials(sub.author_name))}</div>
      <div style="flex:1">
        <div style="font-size:18px;font-weight:800">${escapeHtml(sub.author_name)}</div>
        <div style="color:var(--muted);font-size:12px;margin-top:2px">${fmtDate(sub.submitted_at)}</div>
      </div>
      <span class="sub-status ${sub.status}" style="font-size:12px;padding:5px 14px">${statusLabel(sub.status)}</span>
    </div>

    <div class="info-row"><span class="key">امتیاز</span><span class="val">${sub.score || 0} از ۱۰۰</span></div>
    <div class="info-row"><span class="key">تست‌های پاس‌شده</span><span class="val">${sub.passed_tests || 0} از ${sub.total_tests || tests.length || 1}</span></div>

    <div style="margin-top:20px">
      <h3 style="font-size:14px;color:var(--muted);margin-bottom:10px">💻 کد شاگرد</h3>
      <div class="code-block" style="background:#0b1020;color:#d1fae5;padding:14px 16px;border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:12px;direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-word;max-height:300px;overflow-y:auto;border:1px solid var(--line)">${escapeHtml(sub.code || '(خالی)')}</div>
    </div>

    ${resultsHtml}
  `;
  openModal('👁 پاسخ ' + sub.author_name, body);
}

// ---------- TEAM DETAIL ----------
function openTeamDetail(teamId) {
  const t = teams.find(x => x.id === teamId);
  if (!t) return;
  const color = t.color || colorOf(t.name);
  const session = sessions.find(s => s.id === t.class_id);
  const memberList = membersByTeam[t.id] || [];
  const tCells = (cellsByTeam[t.id] || []).slice().sort((a, b) => new Date(b.updated_at || b.created_at) - new Date(a.updated_at || a.created_at));
  const coderNames = new Set(tCells.map(c => c.author_name).filter(Boolean));

  // Exercises of this class and team's progress
  const classEx = exercises.filter(e => e.class_id === t.class_id);
  const memberNames = new Set(memberList.map(m => m.display_name));
  const teamSubs = submissions.filter(s => memberNames.has(s.author_name));

  const exerciseProgressHtml = classEx.length ? classEx.map(ex => {
    const tests = (ex.test_cases || []).length;
    const exSubs = teamSubs.filter(s => s.exercise_id === ex.id);
    const correctMembers = new Set(exSubs.filter(s => s.status === 'correct').map(s => s.author_name));
    const partialMembers = new Set(exSubs.filter(s => s.status === 'partial').map(s => s.author_name));
    return `
      <div class="info-row">
        <span class="key"><b style="color:var(--ink)">📝 ${escapeHtml(ex.title)}</b></span>
        <span class="val" style="font-size:12px">
          <span class="ex-chip success">✓ ${correctMembers.size}</span>
          ${partialMembers.size ? `<span class="ex-chip warning" style="margin-right:4px">◐ ${partialMembers.size}</span>` : ''}
          <span style="color:var(--muted);margin-right:6px">از ${memberList.length} · ${tests} تست</span>
        </span>
      </div>
    `;
  }).join('') : '<div class="empty" style="padding:16px">این کلاس تمرینی نداره</div>';

  const membersHtml = memberList.length ? `
    <div class="member-chips">
      ${memberList.map(m => {
        const c = colorOf(m.display_name);
        const isCoder = coderNames.has(m.display_name);
        const cellCount = tCells.filter(x => x.author_name === m.display_name).length;
        const solvedEx = teamSubs.filter(x => x.author_name === m.display_name && x.status === 'correct').length;
        return `<span class="member-chip ${isCoder ? '' : 'inactive'}"><span class="dot" style="background:${c}">${escapeHtml(initials(m.display_name))}</span>${escapeHtml(m.display_name)}${solvedEx > 0 ? ` (${solvedEx} تمرین)` : (isCoder ? ` (${cellCount})` : '')}</span>`;
      }).join('')}
    </div>` : '<div class="empty" style="padding:16px">هنوز عضوی ندارد</div>';

  const cellsHtml = tCells.length ? tCells.slice(0, 15).map(c => {
    const hasErr = c.output && (c.output.includes('Error') || c.output.includes('Pyodide'));
    const preview = (c.code || '').slice(0, 60).replace(/\n/g, ' ');
    return `
      <div class="info-row" data-cell-open="${c.id}" style="cursor:pointer">
        <span class="key"><b style="color:var(--ink)">${escapeHtml(c.author_name || 'ناشناس')}</b><span style="color:var(--muted);font-size:11px"> ${fmtRelative(c.updated_at || c.created_at)}</span></span>
        <span class="val" style="color:${hasErr ? 'var(--danger)' : 'var(--muted)'};font-family:monospace;font-size:11px;direction:ltr;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(preview || '(خالی)')}</span>
      </div>`;
  }).join('') : '<div class="empty" style="padding:16px">هنوز کدی نوشته نشده</div>';

  const body = `
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px">
      <div class="team-color" style="background:${color};width:56px;height:56px;font-size:20px">${escapeHtml(initials(t.name))}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:20px;font-weight:800">${escapeHtml(t.name)}</div>
        <div style="color:var(--muted);font-size:13px;margin-top:2px">${session ? `📚 <b>${escapeHtml(session.title)}</b> <span style="font-family:monospace;font-size:11px;color:var(--primary)">(${escapeHtml(session.code)})</span>` : 'بدون کلاس'}</div>
      </div>
    </div>

    <div class="info-row"><span class="key">ایجاد</span><span class="val">${fmtDate(t.created_at)}</span></div>
    <div class="info-row"><span class="key">تعداد اعضا</span><span class="val">${memberList.length}</span></div>
    <div class="info-row"><span class="key">تعداد کدنویس‌ها</span><span class="val">${coderNames.size} از ${memberList.length}</span></div>
    <div class="info-row"><span class="key">تعداد سلول‌ها</span><span class="val">${tCells.length}</span></div>

    <div style="margin-top:24px">
      <h3 style="font-size:14px;color:var(--muted);margin-bottom:10px">📝 پیشرفت تمرین‌ها</h3>
      ${exerciseProgressHtml}
    </div>

    <div style="margin-top:24px">
      <h3 style="font-size:14px;color:var(--muted);margin-bottom:10px">👥 اعضا</h3>
      ${membersHtml}
    </div>

    <div style="margin-top:20px">
      <h3 style="font-size:14px;color:var(--muted);margin-bottom:10px">💻 سلول‌ها ${tCells.length > 15 ? `(نمایش ۱۵ از ${tCells.length})` : `(${tCells.length})`}</h3>
      ${cellsHtml}
    </div>

    ${session ? `
    <div style="margin-top:24px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-primary" id="filterFromTeamBtn">🎯 فیلتر روی کلاس «${escapeHtml(session.title)}»</button>
    </div>` : ''}
  `;
  openModal('🧑‍🤝‍🧑 ' + t.name, body);

  setTimeout(() => {
    document.querySelectorAll('[data-cell-open]').forEach(el => {
      el.onclick = () => openCellDetail(el.getAttribute('data-cell-open'));
    });
    document.getElementById('filterFromTeamBtn')?.addEventListener('click', () => {
      if (!session) return;
      setFilterSession(session.id);
      closeModal();
      toast('فیلتر روی کلاس «' + session.title + '» اعمال شد', 'info');
    });
  }, 0);
}

// ---------- STUDENT DETAIL ----------
function openStudentDetail(name) {
  const s = studentsByName[name];
  if (!s) return;
  const color = colorOf(name);
  const myCells = cells.filter(c => c.author_name === name).sort((a, b) => new Date(b.updated_at || b.created_at) - new Date(a.updated_at || a.created_at));

  const myMemberships = teamMembers.filter(m => m.display_name === name);
  const mySubs = submissions.filter(x => x.author_name === name);

  // Teams grouped by class
  const teamsByClassForStudent = {};
  [...s.teamRefs].forEach(tid => {
    const t = teams.find(x => x.id === tid);
    if (!t) return;
    const cid = t.class_id;
    if (!teamsByClassForStudent[cid]) teamsByClassForStudent[cid] = [];
    teamsByClassForStudent[cid].push(t);
  });

  const classBlocksHtml = Object.entries(teamsByClassForStudent).map(([cid, list]) => {
    const cls = sessions.find(x => x.id === cid);
    const teamsHtml = list.map(t => {
      const tc = t.color || colorOf(t.name);
      const isMember = myMemberships.some(m => m.team_id === t.id);
      return `<span class="team-tag"><span class="tdot" style="background:${tc}"></span><span class="tname">${escapeHtml(t.name)}</span>${isMember ? '<span style="color:var(--success);font-size:10px">✓</span>' : ''}</span>`;
    }).join('');
    return `
      <div style="margin-bottom:14px;padding:12px 14px;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius-sm)">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          <span class="code-chip" style="font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;letter-spacing:2px;color:var(--primary);background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.3);padding:3px 10px;border-radius:999px">${escapeHtml(cls?.code || '—')}</span>
          <span style="font-weight:700">${escapeHtml(cls?.title || 'بدون نام')}</span>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:6px">${teamsHtml}</div>
      </div>`;
  }).join('') || '<div class="empty" style="padding:16px">هنوز تیمی ندارد</div>';

  // Exercises progress (all classes this student is in)
  const studentClassIds = new Set([...s.sessionRefs]);
  const relevantEx = exercises.filter(e => studentClassIds.has(e.class_id));
  const exProgressHtml = relevantEx.length ? relevantEx.map(ex => {
    const sub = mySubs.find(x => x.exercise_id === ex.id);
    const status = sub ? sub.status : 'pending';
    const passed = sub ? (sub.passed_tests || 0) : 0;
    const total = sub ? (sub.total_tests || 0) : ((ex.test_cases || []).length || 1);
    const cls = sessions.find(x => x.id === ex.class_id);
    const badge = status === 'correct' ? `<span class="sub-status correct">✓ کامل</span>` :
                  status === 'partial' ? `<span class="sub-status partial">◐ ${passed}/${total}</span>` :
                  status === 'wrong' ? `<span class="sub-status wrong">✗ نادرست</span>` :
                  status === 'error' ? `<span class="sub-status error">⚠ خطا</span>` :
                  `<span class="sub-status pending">○ حل نشده</span>`;
    return `
      <div class="info-row" data-ex-open="${ex.id}" style="cursor:pointer">
        <span class="key"><b style="color:var(--ink)">📝 ${escapeHtml(ex.title)}</b><span style="color:var(--muted);font-size:11px"> ${escapeHtml(cls?.title || '—')}</span></span>
        <span class="val">${badge}</span>
      </div>
    `;
  }).join('') : '<div class="empty" style="padding:16px">تمرینی در کلاس‌های این دانشجو نیست</div>';

  const cellsHtml = myCells.slice(0, 15).map(c => {
    const hasErr = c.output && (c.output.includes('Error') || c.output.includes('Pyodide'));
    const preview = (c.code || '').slice(0, 60).replace(/\n/g, ' ');
    const cls = sessions.find(x => x.id === c.class_id);
    return `
      <div class="info-row" data-cell-open="${c.id}" style="cursor:pointer">
        <span class="key" style="color:var(--muted);font-size:11px">${escapeHtml(cls?.title || '—')} · ${fmtRelative(c.updated_at || c.created_at)}</span>
        <span class="val" style="color:${hasErr ? 'var(--danger)' : 'var(--muted)'};font-family:monospace;font-size:11px;direction:ltr;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(preview || '(خالی)')}</span>
      </div>`;
  }).join('');

  const memberBadge = s.isMember
    ? `<span style="font-size:11px;background:rgba(16,185,129,.15);color:var(--success);padding:3px 10px;border-radius:999px;font-weight:700;border:1px solid rgba(16,185,129,.3)">✓ عضو تیم</span>`
    : `<span style="font-size:11px;background:rgba(148,163,184,.15);color:var(--muted);padding:3px 10px;border-radius:999px;font-weight:700;border:1px solid var(--line)">بدون عضویت</span>`;

  const solvedExCount = mySubs.filter(x => x.status === 'correct').length;

  const body = `
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px">
      <div class="team-color" style="background:${color};width:56px;height:56px;font-size:20px">${escapeHtml(initials(name))}</div>
      <div>
        <div style="font-size:20px;font-weight:800">${escapeHtml(name)}</div>
        <div style="margin-top:4px">${memberBadge}</div>
      </div>
    </div>

    <div class="info-row"><span class="key">سلول‌ها</span><span class="val">${s.cells}</span></div>
    <div class="info-row"><span class="key">تمرین‌های حل‌شده</span><span class="val">${solvedExCount}</span></div>
    <div class="info-row"><span class="key">نظرات</span><span class="val">${s.comments}</span></div>
    <div class="info-row"><span class="key">عضویت‌های تیم</span><span class="val">${myMemberships.length}</span></div>
    <div class="info-row"><span class="key">آخرین فعالیت</span><span class="val">${fmtRelative(s.lastActive)}</span></div>

    <div style="margin-top:20px">
      <h3 style="font-size:14px;color:var(--muted);margin-bottom:10px">📝 پیشرفت تمرین‌ها</h3>
      ${exProgressHtml}
    </div>

    <div style="margin-top:20px">
      <h3 style="font-size:14px;color:var(--muted);margin-bottom:10px">🧑‍🤝‍🧑 تیم‌ها بر اساس کلاس</h3>
      ${classBlocksHtml}
    </div>

    <div style="margin-top:20px">
      <h3 style="font-size:14px;color:var(--muted);margin-bottom:10px">💻 کدهای این دانشجو ${myCells.length > 15 ? `(نمایش ۱۵ از ${myCells.length})` : `(${myCells.length})`}</h3>
      ${cellsHtml || '<div class="empty" style="padding:16px">چیزی نیست</div>'}
    </div>
  `;
  openModal('🎓 ' + name, body);

  setTimeout(() => {
    document.querySelectorAll('[data-cell-open]').forEach(el => {
      el.onclick = () => openCellDetail(el.getAttribute('data-cell-open'));
    });
    document.querySelectorAll('[data-ex-open]').forEach(el => {
      el.onclick = () => {
        closeModal();
        setTimeout(() => openExerciseDetail(el.getAttribute('data-ex-open')), 100);
      };
    });
  }, 0);
}

// ---------- CELL DETAIL ----------
function openCellDetail(cellId) {
  const c = cells.find(x => x.id === cellId);
  if (!c) return;
  const session = sessions.find(s => s.id === c.class_id);
  const team = teams.find(t => t.id === c.team_id);
  const hasErr = c.output && (c.output.includes('Error') || c.output.includes('Pyodide'));

  const body = `
    <div class="info-row"><span class="key">نویسنده</span><span class="val">${escapeHtml(c.author_name || 'ناشناس')}</span></div>
    <div class="info-row"><span class="key">تیم</span><span class="val">${team ? escapeHtml(team.name) : '📝 شخصی'}</span></div>
    <div class="info-row"><span class="key">کلاس</span><span class="val">${session ? escapeHtml(session.title) + ' <span style="font-family:monospace;font-size:11px;color:var(--primary)">(' + escapeHtml(session.code) + ')</span>' : '—'}</span></div>
    <div class="info-row"><span class="key">ایجاد</span><span class="val">${fmtDate(c.created_at)}</span></div>
    <div class="info-row"><span class="key">آخرین ویرایش</span><span class="val">${fmtDate(c.updated_at || c.created_at)}</span></div>

    <div style="margin-top:20px">
      <h3 style="font-size:14px;color:var(--muted);margin-bottom:10px">💻 کد</h3>
      <div class="code-block">${escapeHtml(c.code || '(خالی)')}</div>
    </div>

    ${c.output ? `
      <div style="margin-top:20px">
        <h3 style="font-size:14px;color:var(--muted);margin-bottom:10px">📤 خروجی</h3>
        <div class="code-block ${hasErr ? 'err' : ''}">${escapeHtml(c.output)}</div>
      </div>
    ` : ''}
  `;
  openModal('💻 سلول ' + (c.id.slice(0, 8)), body);
}

// =============== EXPORT ===============
function exportClassJSON(sessionId) {
  const s = sessions.find(x => x.id === sessionId);
  if (!s) return;
  const sTeams = teams.filter(t => t.class_id === sessionId);
  const teamIds = new Set(sTeams.map(t => t.id));
  const sEx = exercises.filter(e => e.class_id === sessionId);
  const exIds = new Set(sEx.map(e => e.id));
  const data = {
    session: s,
    teams: sTeams,
    team_members: teamMembers.filter(m => teamIds.has(m.team_id)),
    cells: cells.filter(c => c.class_id === sessionId),
    exercises: sEx,
    exercise_submissions: submissions.filter(s => exIds.has(s.exercise_id)),
    exported_at: new Date().toISOString()
  };
  downloadJSON(data, `class-${s.code}-${new Date().toISOString().slice(0, 10)}.json`);
  toast('خروجی گرفته شد', 'ok');
}
function exportAllJSON() {
  const data = {
    exported_at: new Date().toISOString(),
    stats: {
      sessions: sessions.length,
      teams: teams.length,
      team_members: teamMembers.length,
      cells: cells.length,
      comments: comments.length,
      exercises: exercises.length,
      exercise_submissions: submissions.length,
      students: Object.keys(studentsByName).length
    },
    sessions, teams, team_members: teamMembers, cells, comments, exercises, exercise_submissions: submissions
  };
  downloadJSON(data, `admin-backup-${new Date().toISOString().slice(0, 10)}.json`);
  toast('بکاپ کامل دانلود شد', 'ok');
}
function downloadJSON(obj, filename) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

// =============== INIT ===============
if (sessionStorage.getItem('adminAuth') === 'true') {
  showDashboard();
}
</script>
