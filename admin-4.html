<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پنل مدیریت - کلاس پایتون</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
:root {
  --bg: #0b1020; --bg-2: #0f172a; --card: #1e293b; --card-2: #253347;
  --ink: #f1f5f9; --muted: #94a3b8; --line: #334155;
  --primary: #6366f1; --primary-2: #8b5cf6;
  --success: #10b981; --warning: #f59e0b; --danger: #ef4444; --info: #06b6d4;
  --radius: 14px; --radius-sm: 10px;
  --shadow: 0 10px 30px rgba(0,0,0,0.35);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: radial-gradient(1200px 600px at 100% -10%, rgba(139,92,246,.10), transparent 60%),
              radial-gradient(900px 500px at -10% 0%, rgba(99,102,241,.10), transparent 55%),
              var(--bg);
  color: var(--ink); font-family: 'Vazirmatn', sans-serif;
  min-height: 100vh; line-height: 1.6;
}

/* LOGIN */
.login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; position: fixed; inset: 0; background: linear-gradient(135deg, #0b1020, #1e293b); z-index: 9999; }
.login-screen.hidden { display: none; }
.login-box { background: var(--card); padding: 44px 36px; border-radius: 20px; box-shadow: var(--shadow); max-width: 420px; width: 100%; border: 1px solid var(--line); animation: pop .4s ease-out; }
@keyframes pop { from { opacity: 0; transform: scale(.95); } to { opacity: 1; transform: scale(1); } }
.login-box h1 { font-size: 26px; margin-bottom: 8px; text-align: center; }
.login-box p { color: var(--muted); text-align: center; margin-bottom: 26px; font-size: 14px; }
.login-box input { width: 100%; padding: 14px 16px; border: 2px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink); font-size: 16px; font-family: inherit; margin-bottom: 16px; text-align: center; font-weight: 600; transition: border-color .2s; }
.login-box input:focus { outline: none; border-color: var(--primary); }
.login-box button { width: 100%; padding: 14px; border: none; border-radius: 12px; background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: white; font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit; transition: all .2s; }
.login-box button:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(99,102,241,.4); }
.error-msg { color: var(--danger); text-align: center; margin-top: 12px; font-size: 13px; min-height: 20px; }

/* DASHBOARD */
.dashboard { display: none; max-width: 1400px; margin: 0 auto; padding: 28px 24px 80px; }
.dashboard.show { display: block; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; gap: 16px; }
.header h1 { font-size: 26px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
.header-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
.header-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.btn { padding: 10px 16px; border-radius: var(--radius-sm); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--ink); transition: all .2s; display: inline-flex; align-items: center; gap: 7px; }
.btn:hover { transform: translateY(-1px); border-color: var(--primary); }
.btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-2)); border-color: transparent; color: white; }
.btn-primary:hover { box-shadow: 0 8px 20px rgba(99,102,241,.35); }
.btn-danger { color: var(--danger); border-color: rgba(239,68,68,.4); background: rgba(239,68,68,.08); }
.btn-danger:hover { background: var(--danger); color: white; }
.btn-ghost { background: transparent; }
.btn.active { background: var(--primary); color: white; border-color: var(--primary); }
.btn-sm { padding: 6px 11px; font-size: 12px; }

/* STATS */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat-card { background: linear-gradient(135deg, var(--card), var(--card-2)); padding: 20px; border-radius: var(--radius); border: 1px solid var(--line); position: relative; overflow: hidden; transition: all .25s; }
.stat-card:hover { transform: translateY(-3px); border-color: var(--primary); }
.stat-card .icon { position: absolute; top: 14px; left: 16px; font-size: 22px; opacity: .35; }
.stat-card h3 { font-size: 12px; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
.stat-card .value { font-size: 34px; font-weight: 800; background: linear-gradient(135deg, var(--primary), var(--primary-2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1.1; }
.stat-card .sub { font-size: 11px; color: var(--muted); margin-top: 6px; }

/* TABS */
.tabs { display: flex; gap: 6px; margin-bottom: 20px; padding: 6px; background: var(--card); border-radius: var(--radius); border: 1px solid var(--line); overflow-x: auto; flex-wrap: wrap; }
.tab { padding: 10px 18px; border: none; background: transparent; border-radius: var(--radius-sm); font-family: inherit; font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; transition: all .2s; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.tab:hover { color: var(--ink); background: rgba(99,102,241,.08); }
.tab.active { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(99,102,241,.3); }

/* SEARCH */
.search-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
.search-input { flex: 1; min-width: 200px; padding: 12px 16px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--card); color: var(--ink); font-family: inherit; font-size: 14px; transition: border-color .2s; }
.search-input:focus { outline: none; border-color: var(--primary); }
.search-input::placeholder { color: var(--muted); }

/* SECTIONS */
.section { background: var(--card); padding: 24px; border-radius: var(--radius); border: 1px solid var(--line); margin-bottom: 20px; }
.section h2 { font-size: 18px; margin-bottom: 18px; display: flex; align-items: center; gap: 10px; }
.section h2 .count { font-size: 12px; background: var(--primary); color: white; padding: 2px 10px; border-radius: 999px; font-weight: 700; }

/* CLASS GROUP */
.class-group { margin-bottom: 28px; }
.class-group:last-child { margin-bottom: 0; }
.class-group-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px dashed var(--line); }
.class-group-head .code-chip { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 2px; color: var(--primary); background: rgba(99,102,241,.12); border: 1px solid rgba(99,102,241,.3); padding: 3px 10px; border-radius: 999px; }
.class-group-head .name { font-weight: 700; font-size: 15px; }
.class-group-head .count-badge { font-size: 11px; color: var(--muted); margin-right: auto; }

/* CLASS GRID */
.class-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.class-card { background: linear-gradient(180deg, var(--bg-2), var(--card)); padding: 20px; border-radius: var(--radius); border: 1px solid var(--line); transition: all .25s; cursor: pointer; position: relative; overflow: hidden; }
.class-card::before { content: ''; position: absolute; top: 0; right: 0; width: 100%; height: 3px; background: linear-gradient(90deg, var(--primary), var(--primary-2), #ec4899); }
.class-card:hover { border-color: var(--primary); transform: translateY(-4px); box-shadow: 0 14px 30px rgba(0,0,0,.35); }
.class-card h3 { font-size: 17px; margin-bottom: 10px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.class-code { display: inline-flex; align-items: center; gap: 6px; background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: white; padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; font-family: 'JetBrains Mono', monospace; letter-spacing: 2px; margin-bottom: 12px; cursor: pointer; transition: all .2s; }
.class-code:hover { transform: scale(1.05); }
.class-meta { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
.class-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding-top: 14px; border-top: 1px solid var(--line); }
.class-stat { text-align: center; }
.class-stat .num { font-size: 18px; font-weight: 800; color: var(--primary); }
.class-stat .label { font-size: 10px; color: var(--muted); font-weight: 600; margin-top: 2px; }

/* TEAM LIST */
.team-list { display: flex; flex-direction: column; gap: 10px; }
.team-item { background: var(--bg-2); padding: 14px 18px; border-radius: var(--radius-sm); border: 1px solid var(--line); border-right: 4px solid; display: flex; justify-content: space-between; align-items: center; gap: 14px; transition: all .2s; cursor: pointer; flex-wrap: wrap; }
.team-item:hover { background: var(--card-2); transform: translateX(-3px); }
.team-info { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
.team-color { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: white; font-weight: 800; font-size: 14px; flex-shrink: 0; box-shadow: 0 4px 10px rgba(0,0,0,.3); }
.team-name { font-size: 15px; font-weight: 700; }
.team-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
.team-stats { display: flex; gap: 14px; }
.team-stat { text-align: center; min-width: 44px; }
.team-stat .num { font-size: 17px; font-weight: 800; color: var(--primary); }
.team-stat .label { font-size: 10px; color: var(--muted); font-weight: 600; }

/* LEADERBOARD */
.lb-row { display: flex; align-items: center; gap: 14px; padding: 14px 18px; background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius-sm); margin-bottom: 8px; transition: all .2s; }
.lb-row:hover { transform: translateX(-3px); border-color: var(--primary); }
.lb-rank { font-size: 22px; font-weight: 800; min-width: 44px; text-align: center; color: var(--muted); }
.lb-rank.gold { color: #fbbf24; }
.lb-rank.silver { color: #cbd5e1; }
.lb-rank.bronze { color: #d97706; }
.lb-body { flex: 1; min-width: 0; }
.lb-title { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.lb-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
.lb-bar { height: 6px; background: var(--line); border-radius: 999px; margin-top: 8px; overflow: hidden; max-width: 300px; }
.lb-bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--primary-2)); border-radius: 999px; transition: width .5s; }
.lb-score { font-size: 22px; font-weight: 800; color: var(--success); min-width: 60px; text-align: center; }

/* ACTIVITY */
.activity-item { display: flex; align-items: center; gap: 14px; padding: 12px 16px; background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius-sm); margin-bottom: 8px; font-size: 13px; }
.activity-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--success); flex-shrink: 0; box-shadow: 0 0 0 4px rgba(16,185,129,.15); }
.activity-time { color: var(--muted); font-size: 11px; margin-right: auto; }
.activity-author { font-weight: 700; }

/* MEMBER CHIPS */
.member-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.member-chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; background: rgba(99,102,241,.12); border: 1px solid rgba(99,102,241,.3); color: #a5b4fc; border-radius: 999px; font-size: 11px; font-weight: 600; }
.member-chip .dot { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; color: white; font-size: 9px; font-weight: 800; }
.member-chip.inactive { background: rgba(148,163,184,.10); border-color: var(--line); color: var(--muted); }
.member-chip.inactive .dot { opacity: .5; }

/* TEAM-TAG */
.team-tag { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; background: rgba(148,163,184,.12); border: 1px solid var(--line); border-radius: 999px; font-size: 11px; font-weight: 600; color: var(--ink); }
.team-tag .tdot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.team-tag .tname { font-weight: 700; }
.team-tag .tclass { color: var(--muted); font-size: 10px; }

/* ============ EXERCISES ============ */
.ex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.ex-card { background: linear-gradient(180deg, var(--bg-2), var(--card)); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; cursor: pointer; transition: all .25s; position: relative; overflow: hidden; }
.ex-card:hover { border-color: var(--primary); transform: translateY(-3px); box-shadow: 0 12px 28px rgba(0,0,0,.35); }
.ex-card h3 { font-size: 16px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: flex-start; gap: 8px; }
.ex-card .desc { font-size: 12px; color: var(--muted); line-height: 1.6; max-height: 52px; overflow: hidden; margin-bottom: 12px; }
.ex-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--muted); padding-top: 10px; border-top: 1px dashed var(--line); margin-bottom: 10px; flex-wrap: wrap; }
.ex-chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; background: rgba(99,102,241,.12); color: var(--primary); border: 1px solid rgba(99,102,241,.3); }
.ex-chip.success { background: rgba(16,185,129,.12); color: var(--success); border-color: rgba(16,185,129,.3); }
.ex-chip.warning { background: rgba(245,158,11,.12); color: var(--warning); border-color: rgba(245,158,11,.3); }
.ex-chip.danger { background: rgba(239,68,68,.12); color: var(--danger); border-color: rgba(239,68,68,.3); }

.ex-stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; padding: 12px; background: rgba(0,0,0,.2); border-radius: var(--radius-sm); }
.ex-stat { text-align: center; }
.ex-stat .num { font-size: 18px; font-weight: 800; line-height: 1.2; }
.ex-stat .num.total { color: var(--primary); }
.ex-stat .num.correct { color: var(--success); }
.ex-stat .num.partial { color: var(--warning); }
.ex-stat .num.wrong { color: var(--danger); }
.ex-stat .label { font-size: 10px; color: var(--muted); font-weight: 700; margin-top: 2px; }

.ex-progress { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; display: flex; margin-bottom: 4px; }
.ex-progress .bar-correct { background: var(--success); }
.ex-progress .bar-partial { background: var(--warning); }
.ex-progress .bar-wrong { background: var(--danger); }
.ex-progress .bar-pending { background: var(--line); }

/* Test cases preview */
.tc-preview-list { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.tc-preview { background: #f8fafc; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 12px; }
.tc-preview-head { font-weight: 800; font-size: 12px; color: var(--primary); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.tc-preview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tc-preview-col .label { font-size: 10px; font-weight: 800; color: var(--muted); text-transform: uppercase; margin-bottom: 3px; }
.tc-preview-col .value { font-family: 'JetBrains Mono', monospace; font-size: 11px; background: white; padding: 6px 8px; border-radius: 6px; white-space: pre-wrap; word-break: break-word; direction: ltr; text-align: left; max-height: 80px; overflow-y: auto; border: 1px solid var(--line); }
.tc-preview-col.input .value { color: #6d28d9; }
.tc-preview-col.expected .value { color: #065f46; }

/* Submissions inside exercise detail */
.sub-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: #f8fafc; border: 1px solid var(--line); border-radius: var(--radius-sm); cursor: pointer; transition: var(--transition); margin-bottom: 8px; }
.sub-row:hover { border-color: var(--primary); background: white; transform: translateX(-3px); }
.sub-avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: white; font-weight: 700; font-size: 13px; flex-shrink: 0; }
.sub-info { flex: 1; min-width: 0; }
.sub-name { font-weight: 700; font-size: 14px; }
.sub-time { font-size: 11px; color: var(--muted); margin-top: 2px; }
.sub-status { font-size: 11px; font-weight: 800; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.sub-status.correct { background: rgba(16,185,129,.15); color: #065f46; }
.sub-status.partial { background: rgba(245,158,11,.15); color: #92400e; }
.sub-status.wrong { background: rgba(239,68,68,.15); color: #991b1b; }
.sub-status.error { background: rgba(245,158,11,.15); color: #92400e; }
.sub-status.pending { background: rgba(148,163,184,.15); color: var(--muted); }

/* MODAL */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; z-index: 9000; padding: 20px; }
.modal-overlay.show { display: flex; }
.modal { background: var(--card); border-radius: 20px; border: 1px solid var(--line); max-width: 800px; width: 100%; max-height: 88vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.5); animation: modalIn .3s ease-out; position: relative; }
.modal-wide { max-width: 1000px; }
@keyframes modalIn { from { opacity: 0; transform: scale(.95) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
.modal-head { padding: 24px 28px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--card); z-index: 2; border-radius: 20px 20px 0 0; }
.modal-head h2 { font-size: 20px; }
.modal-close { width: 36px; height: 36px; border-radius: 50%; border: none; background: rgba(148,163,184,.15); color: var(--muted); font-size: 18px; cursor: pointer; transition: all .2s; }
.modal-close:hover { background: var(--danger); color: white; }
.modal-body { padding: 24px 28px; }

.code-block { background: #0b1020; color: #d1fae5; padding: 14px 16px; border-radius: var(--radius-sm); font-family: 'JetBrains Mono', monospace; font-size: 12px; direction: ltr; text-align: left; white-space: pre-wrap; word-break: break-word; max-height: 300px; overflow-y: auto; border: 1px solid var(--line); }
.code-block.err { color: #fca5a5; }

.info-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed var(--line); font-size: 13px; gap: 12px; flex-wrap: wrap; }
.info-row:last-child { border-bottom: none; }
.info-row .key { color: var(--muted); }
.info-row .val { font-weight: 600; }

/* Test results detail */
.test-result-row { background: #f8fafc; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
.test-result-row.pass { border-color: rgba(16,185,129,.45); background: #f0fdf4; }
.test-result-row.fail { border-color: rgba(239,68,68,.45); background: #fef2f2; }
.test-result-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.test-result-num { font-weight: 800; font-size: 12px; display: flex; align-items: center; gap: 6px; }
.test-result-row.pass .test-result-num { color: #065f46; }
.test-result-row.fail .test-result-num { color: #991b1b; }
.test-result-status { font-size: 11px; font-weight: 800; padding: 2px 9px; border-radius: 999px; }
.test-result-row.pass .test-result-status { background: var(--success); color: white; }
.test-result-row.fail .test-result-status { background: var(--danger); color: white; }
.tc-compare { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
@media (max-width: 700px) { .tc-compare { grid-template-columns: 1fr; } }
.tc-col { background: rgba(0,0,0,.03); border-radius: 6px; padding: 8px 10px; }
.tc-col .label { font-weight: 800; color: var(--muted); font-size: 10px; text-transform: uppercase; margin-bottom: 4px; }
.tc-col .value { font-family: 'JetBrains Mono', monospace; font-size: 12px; white-space: pre-wrap; word-break: break-word; direction: ltr; text-align: left; max-height: 100px; overflow-y: auto; }
.tc-col.input .value { color: #6d28d9; }
.tc-col.expected .value { color: #065f46; }
.tc-col.actual .value { color: #991b1b; }
.test-result-row.pass .tc-col.actual .value { color: #065f46; }

/* LOADER */
.loader { text-align: center; padding: 60px 20px; color: var(--muted); }
.spinner { width: 40px; height: 40px; border: 4px solid var(--line); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 15px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* TOAST */
.toasts { position: fixed; bottom: 24px; left: 24px; display: flex; flex-direction: column; gap: 10px; z-index: 99999; }
.toast { background: var(--card); border: 1px solid var(--line); color: var(--ink); padding: 12px 18px; border-radius: var(--radius-sm); box-shadow: var(--shadow); font-size: 13px; display: flex; align-items: center; gap: 10px; animation: toastIn .3s ease-out; min-width: 220px; }
.toast.ok { border-color: var(--success); background: linear-gradient(135deg, rgba(16,185,129,.15), var(--card)); }
.toast.err { border-color: var(--danger); background: linear-gradient(135deg, rgba(239,68,68,.15), var(--card)); }
.toast.info { border-color: var(--primary); background: linear-gradient(135deg, rgba(99,102,241,.15), var(--card)); }
@keyframes toastIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

/* EMPTY */
.empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; }
.empty .emoji { font-size: 42px; margin-bottom: 10px; display: block; opacity: .6; }

/* AUTO REFRESH */

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

const SUPABASE_URL = 'https://fqwlbqpduxmpnlvxrmsy.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZxd2xicXBkdXhtcG5sdnhybXN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4MTUwNjEsImV4cCI6MjEwNTM5MTA2MX0.5qvPUi_grBuUgITLpG0-QShzLsLaiA07i7pWRtnsWPc';
const ADMIN_PASSWORD = 'admin2025';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const PALETTE = ['#6366f1','#8b5cf6','#ec4899','#f43f5e','#f59e0b','#10b981','#06b6d4','#3b82f6','#84cc16','#eab308'];

function colorOf(name) {
  let h = 0;
  const s = name || '؟';
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return PALETTE[h % PALETTE.length];
}
function initials(name) {
  const s = (name || '؟').trim();
  const parts = s.split(/\s+/);
  if (parts.length === 1) return parts[0].slice(0, 1).toUpperCase();
  return (parts[0][0] + parts[1][0]).toUpperCase();
}
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
}
function fmtDate(iso) {
  if (!iso) return '—';
  try { return new Date(iso).toLocaleString('fa-IR'); } catch { return iso; }
}
function fmtRelative(iso) {
  if (!iso) return '—';
  const diff = Date.now() - new Date(iso).getTime();
  const s = Math.floor(diff / 1000);
  if (s < 60) return 'همین حالا';
  const m = Math.floor(s / 60);
  if (m < 60) return `${m} دقیقه پیش`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h} ساعت پیش`;
  const d = Math.floor(h / 24);
  if (d < 30) return `${d} روز پیش`;
  return fmtDate(iso);
}
function toast(msg, type = 'info', ms = 3000) {
  const icons = { ok: '✓', err: '✕', info: 'ℹ' };
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.innerHTML = `<b>${icons[type] || ''}</b><span>${escapeHtml(msg)}</span>`;
  document.getElementById('toasts').appendChild(t);
  setTimeout(() => t.remove(), ms);
}
function statusLabel(s) {
  return s === 'correct' ? '✓ کامل' :
         s === 'partial' ? '◐ ناقص' :
         s === 'wrong' ? '✗ نادرست' :
         s === 'error' ? '⚠ خطا' :
         '○ نامشخص';
}

// =============== STATE ===============
let sessions = [];
let teams = [];
let teamMembers = [];
let cells = [];
let comments = [];
let exercises = [];
let submissions = [];
let activeTab = 'classes';
let searchQuery = '';
let filterSessionId = '';
let autoRefreshInterval = null;

// Derived
let membersByTeam = {};
let membersBySession = {};
let cellsByTeam = {};
let cellsBySession = {};
let teamsBySession = {};
let commentsByCell = {};
let studentsByName = {};
let codersByName = {};
let exercisesByClass = {};
let submissionsByExercise = {};
let submissionsByStudent = {};

// =============== LOGIN ===============
function doLogin() {
  const pw = document.getElementById('passwordInput').value;
  if (pw === ADMIN_PASSWORD) {
    sessionStorage.setItem('adminAuth', 'true');
    showDashboard();
  } else {
    document.getElementById('errorMsg').textContent = 'رمز عبور اشتباه است';
  }
}
function showDashboard() {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('dashboard').classList.add('show');
  loadData();
}
function doLogout() {
  sessionStorage.removeItem('adminAuth');
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('dashboard').classList.remove('show');
  document.getElementById('passwordInput').value = '';
  document.getElementById('errorMsg').textContent = '';
  if (autoRefreshInterval) { clearInterval(autoRefreshInterval); autoRefreshInterval = null; }
}
document.getElementById('loginBtn').onclick = doLogin;
document.getElementById('passwordInput').addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('logoutBtn').onclick = doLogout;
document.getElementById('refreshBtn').onclick = loadData;
document.getElementById('exportAllBtn').onclick = exportAllJSON;

document.getElementById('autoRefreshToggle').onchange = (e) => {
  if (e.target.checked) {
    autoRefreshInterval = setInterval(loadData, 30000);
    toast('به‌روزرسانی خودکار فعال شد (هر ۳۰ ثانیه)', 'info');
  } else {
    if (autoRefreshInterval) { clearInterval(autoRefreshInterval); autoRefreshInterval = null; }
    toast('به‌روزرسانی خودکار خاموش شد', 'info');
  }
};

document.getElementById('tabs').addEventListener('click', (e) => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  activeTab = tab.getAttribute('data-tab');
  render();
});

document.getElementById('searchInput').addEventListener('input', (e) => {
  searchQuery = e.target.value.trim().toLowerCase();
  render();
});
document.getElementById('filterSession').addEventListener('change', (e) => {
  filterSessionId = e.target.value;
  renderActiveFilterChip();
  render();
});
function setFilterSession(id) {
  filterSessionId = id || '';
  document.getElementById('filterSession').value = filterSessionId;
  renderActiveFilterChip();
  render();
}
function renderActiveFilterChip() {
  const wrap = document.getElementById('activeFilterChip');
  if (!filterSessionId) { wrap.innerHTML = ''; return; }
  const s = sessions.find(x => x.id === filterSessionId);
  if (!s) { wrap.innerHTML = ''; return; }
  wrap.innerHTML = `<span class="active-filter">📚 ${escapeHtml(s.title || 'بدون نام')} (${escapeHtml(s.code)}) <button id="clearFilterBtn" title="حذف فیلتر">✕</button></span>`;
  const btn = document.getElementById('clearFilterBtn');
  if (btn) btn.onclick = () => setFilterSession('');
}

// =============== LOAD ===============
async function loadData() {
  const tsEl = document.getElementById('timestamp');
  tsEl.textContent = 'در حال بارگذاری…';
  try {
    const [sessRes, teamsRes, membersRes, cellsRes, commentsRes, exRes, subRes] = await Promise.all([
      supabase.from('class_sessions').select('*').order('created_at', { ascending: false }),
      supabase.from('teams').select('*').order('created_at', { ascending: true }),
      supabase.from('team_members').select('*').order('joined_at', { ascending: true }),
      supabase.from('cells').select('*').order('created_at', { ascending: false }),
      supabase.from('comments').select('*').order('created_at', { ascending: false }),
      supabase.from('exercises').select('*').order('created_at', { ascending: false }),
      supabase.from('exercise_submissions').select('*').order('submitted_at', { ascending: false })
    ]);
    if (sessRes.error) throw new Error('کلاس‌ها: ' + sessRes.error.message);
    if (teamsRes.error) throw new Error('تیم‌ها: ' + teamsRes.error.message);
    if (membersRes.error) throw new Error('اعضا: ' + membersRes.error.message);
    if (cellsRes.error) throw new Error('سلول‌ها: ' + cellsRes.error.message);
    if (commentsRes.error) throw new Error('نظرات: ' + commentsRes.error.message);
    if (exRes.error) throw new Error('تمرین‌ها: ' + exRes.error.message);
    if (subRes.error) throw new Error('پاسخ‌ها: ' + subRes.error.message);

    sessions = sessRes.data || [];
    teams = teamsRes.data || [];
    teamMembers = membersRes.data || [];
    cells = cellsRes.data || [];
    comments = commentsRes.data || [];
    exercises = exRes.data || [];
    submissions = subRes.data || [];

    computeDerived();
    populateFilter();
    updateStats();
    render();
    renderActiveFilterChip();

    tsEl.innerHTML = `<span class="pulse-dot"></span> آخرین به‌روزرسانی: ${new Date().toLocaleTimeString('fa-IR')}`;
  } catch (err) {
    console.error(err);
    tsEl.textContent = 'خطا: ' + err.message;
    toast('خطا: ' + err.message, 'err', 6000);
  }
}

function computeDerived() {
  membersByTeam = {}; membersBySession = {};
  cellsByTeam = {}; cellsBySession = {};
  teamsBySession = {}; commentsByCell = {};
  studentsByName = {}; codersByName = {};
  exercisesByClass = {}; submissionsByExercise = {}; submissionsByStudent = {};

  teams.forEach(t => {
    if (!teamsBySession[t.class_id]) teamsBySession[t.class_id] = [];
    teamsBySession[t.class_id].push(t);
  });

  teamMembers.forEach(m => {
    if (!membersByTeam[m.team_id]) membersByTeam[m.team_id] = [];
    membersByTeam[m.team_id].push(m);
    const team = teams.find(t => t.id === m.team_id);
    if (team && team.class_id) {
      if (!membersBySession[team.class_id]) membersBySession[team.class_id] = new Set();
      membersBySession[team.class_id].add(m.display_name);
    }
    if (m.display_name) {
      if (!studentsByName[m.display_name]) {
        studentsByName[m.display_name] = {
          name: m.display_name, cells: 0, comments: 0,
          teamRefs: new Set(), sessionRefs: new Set(),
          lastActive: m.joined_at, isMember: true
        };
      }
      const s = studentsByName[m.display_name];
      s.isMember = true;
      if (m.team_id) s.teamRefs.add(m.team_id);
      if (team && team.class_id) s.sessionRefs.add(team.class_id);
      if (m.joined_at && (!s.lastActive || new Date(m.joined_at) > new Date(s.lastActive))) s.lastActive = m.joined_at;
    }
  });

  cells.forEach(c => {
    if (c.team_id) { if (!cellsByTeam[c.team_id]) cellsByTeam[c.team_id] = []; cellsByTeam[c.team_id].push(c); }
    if (c.class_id) { if (!cellsBySession[c.class_id]) cellsBySession[c.class_id] = []; cellsBySession[c.class_id].push(c); }
    if (c.author_name) {
      if (!studentsByName[c.author_name]) {
        studentsByName[c.author_name] = { name: c.author_name, cells: 0, comments: 0, teamRefs: new Set(), sessionRefs: new Set(), lastActive: c.updated_at || c.created_at, isMember: false };
      }
      const s = studentsByName[c.author_name];
      s.cells++;
      if (c.team_id) s.teamRefs.add(c.team_id);
      if (c.class_id) s.sessionRefs.add(c.class_id);
      const d = c.updated_at || c.created_at;
      if (d && (!s.lastActive || new Date(d) > new Date(s.lastActive))) s.lastActive = d;
      if (!codersByName[c.author_name]) codersByName[c.author_name] = { name: c.author_name, cells: 0, lastActive: d };
      codersByName[c.author_name].cells++;
    }
  });

  comments.forEach(cm => {
    if (!commentsByCell[cm.cell_id]) commentsByCell[cm.cell_id] = [];
    commentsByCell[cm.cell_id].push(cm);
    if (cm.author_name && studentsByName[cm.author_name]) {
      studentsByName[cm.author_name].comments++;
    }
  });

  exercises.forEach(ex => {
    if (!exercisesByClass[ex.class_id]) exercisesByClass[ex.class_id] = [];
    exercisesByClass[ex.class_id].push(ex);
  });

  submissions.forEach(s => {
    if (!submissionsByExercise[s.exercise_id]) submissionsByExercise[s.exercise_id] = [];
    submissionsByExercise[s.exercise_id].push(s);
    if (!submissionsByStudent[s.author_name]) submissionsByStudent[s.author_name] = [];
    submissionsByStudent[s.author_name].push(s);
    if (s.author_name) {
      if (!studentsByName[s.author_name]) {
        studentsByName[s.author_name] = { name: s.author_name, cells: 0, comments: 0, teamRefs: new Set(), sessionRefs: new Set(), lastActive: s.submitted_at, isMember: false };
      }
      const st = studentsByName[s.author_name];
      const d = s.submitted_at;
      if (d && (!st.lastActive || new Date(d) > new Date(st.lastActive))) st.lastActive = d;
    }
  });
}

function populateFilter() {
  const sel = document.getElementById('filterSession');
  const cur = sel.value;
  sel.innerHTML = '<option value="">همه کلاس‌ها</option>' +
    sessions.map(s => `<option value="${s.id}">${escapeHtml(s.title || 'بدون نام')} (${s.code})</option>`).join('');
  sel.value = cur;
  if (cur && !sessions.find(s => s.id === cur)) sel.value = '';
}

// =============== STATS ===============
function updateStats() {
  const totalStudents = Object.keys(studentsByName).length;
  const last24 = Date.now() - 24 * 3600 * 1000;

  document.getElementById('statSessions').textContent = sessions.length;
  document.getElementById('statTeams').textContent = teams.length;
  document.getElementById('statMemberships').textContent = teamMembers.length;
  document.getElementById('statStudents').textContent = totalStudents;
  document.getElementById('statCells').textContent = cells.length;
  document.getElementById('statExercises').textContent = exercises.length;
  const correctSubs = submissions.filter(s => s.status === 'correct').length;
  document.getElementById('statSubmissions').textContent = correctSubs;
  document.getElementById('statComments').textContent = comments.length;

  const activeSet = new Set();
  cells.forEach(c => {
    const d = c.updated_at || c.created_at;
    if (d && new Date(d).getTime() > last24 && c.author_name) activeSet.add(c.author_name);
  });
  submissions.forEach(s => {
    if (s.submitted_at && new Date(s.submitted_at).getTime() > last24 && s.author_name) activeSet.add(s.author_name);
  });
  document.getElementById('statActive').textContent = activeSet.size;

  const codersCount = Object.keys(codersByName).length;
  const avgMembersPerTeam = teams.length ? (teamMembers.length / teams.length).toFixed(1) : '0';
  const totalTests = exercises.reduce((sum, e) => sum + ((e.test_cases || []).length || 0), 0);
  const totalPassed = submissions.reduce((sum, s) => sum + (s.passed_tests || 0), 0);

  document.getElementById('subSessions').textContent = `${teams.length} تیم · ${totalStudents} دانشجو`;
  document.getElementById('subTeams').textContent = `میانگین ${avgMembersPerTeam} در هر تیم`;
  document.getElementById('subMemberships').textContent = `${sessions.length} کلاس فعال`;
  document.getElementById('subStudents').textContent = `${codersCount} نفر کد زدن`;
  const withCode = cells.filter(c => c.code && c.code.trim()).length;
  document.getElementById('subCells').textContent = `${withCode} تا دارای کد`;
  document.getElementById('subExercises').textContent = `${totalTests} تست‌کیس در کل`;
  document.getElementById('subSubmissions').textContent = `از ${submissions.length} پاسخ (${totalPassed} تست پاس)`;
  const errCells = cells.filter(c => c.output && (c.output.includes('Error') || c.output.includes('Pyodide'))).length;
  document.getElementById('subComments').textContent = `${errCells} خطا در کدها`;
  document.getElementById('subActive').textContent = `از ${totalStudents} دانشجو`;
}

// =============== RENDER ===============
function render() {
  const c = document.getElementById('content');
  if (activeTab === 'classes') c.innerHTML = renderClasses();
  else if (activeTab === 'exercises') c.innerHTML = renderExercises();
  else if (activeTab === 'teams') c.innerHTML = renderTeams();
  else if (activeTab === 'leaderboard') c.innerHTML = renderLeaderboard();
  else if (activeTab === 'students') c.innerHTML = renderStudents();
  else if (activeTab === 'activity') c.innerHTML = renderActivity();
  bindContentHandlers();
}

function matchesSearch(...strs) {
  if (!searchQuery) return true;
  return strs.filter(Boolean).join(' ').toLowerCase().includes(searchQuery);
}

// ---------- CLASSES ----------
function renderClasses() {
  const filtered = sessions.filter(s => {
    if (filterSessionId && s.id !== filterSessionId) return false;
    return matchesSearch(s.title, s.code);
  });
  if (!filtered.length) {
    return `<div class="section"><div class="empty"><span class="emoji">📚</span>${sessions.length ? 'چیزی با این جستجو پیدا نشد' : 'هنوز هیچ کلاسی ساخته نشده'}</div></div>`;
  }
  const cards = filtered.map(s => {
    const sTeams = teamsBySession[s.id] || [];
    const sCells = cellsBySession[s.id] || [];
    const sMembers = membersBySession[s.id] ? membersBySession[s.id].size : 0;
    const sEx = exercisesByClass[s.id] || [];
    const teamIds = new Set(sTeams.map(t => t.id));
    const sMemberships = teamMembers.filter(m => teamIds.has(m.team_id)).length;

    return `
      <div class="class-card" data-class-id="${s.id}">
        <h3>${escapeHtml(s.title || 'بدون نام')}</h3>
        <div class="class-code" data-copy-code="${escapeHtml(s.code)}" title="کلیک برای کپی">📋 ${escapeHtml(s.code)}</div>
        <div class="class-meta">ایجاد: ${fmtDate(s.created_at)}</div>
        <div class="class-stats">
          <div class="class-stat"><div class="num">${sTeams.length}</div><div class="label">تیم</div></div>
          <div class="class-stat"><div class="num">${sMembers}</div><div class="label">دانشجو</div></div>
          <div class="class-stat"><div class="num">${sCells.length}</div><div class="label">سلول</div></div>
          <div class="class-stat"><div class="num">${sEx.length}</div><div class="label">تمرین</div></div>
          <div class="class-stat"><div class="num">${sMemberships}</div><div class="label">عضویت</div></div>
        </div>
      </div>`;
  }).join('');
  return `<div class="section">
    <h2>📚 کلاس‌ها <span class="count">${filtered.length}</span></h2>
    <div class="class-grid">${cards}</div>
  </div>`;
}

// ---------- EXERCISES TAB ----------
function renderExercises() {
  const filtered = exercises.filter(ex => {
    if (filterSessionId && ex.class_id !== filterSessionId) return false;
    const cls = sessions.find(x => x.id === ex.class_id);
    return matchesSearch(ex.title, ex.description, cls?.title, cls?.code);
  });

  if (!filtered.length) {
    return `<div class="section"><div class="empty"><span class="emoji">📝</span>${exercises.length ? 'چیزی با این جستجو پیدا نشد' : 'هنوز هیچ تمرینی ساخته نشده'}</div></div>`;
  }

  // گروه‌بندی بر اساس کلاس
  const byClass = {};
  filtered.forEach(ex => {
    if (!byClass[ex.class_id]) byClass[ex.class_id] = [];
    byClass[ex.class_id].push(ex);
  });

  const classBlocks = Object.entries(byClass).map(([cid, list]) => {
    const s = sessions.find(x => x.id === cid);
    const cardsHtml = list.map(ex => renderExerciseCard(ex)).join('');
    return `<div class="class-group">
      <div class="class-group-head">
        <span class="code-chip">${escapeHtml(s?.code || '—')}</span>
        <span class="name">${escapeHtml(s?.title || 'بدون نام')}</span>
        <span class="count-badge">${list.length} تمرین</span>
      </div>
      <div class="ex-grid">${cardsHtml}</div>
    </div>`;
  }).join('');

  return `<div class="section">
    <h2>📝 تمرین‌ها <span class="count">${filtered.length}</span></h2>
    ${classBlocks}
  </div>`;
}

function renderExerciseCard(ex) {
  const tests = Array.isArray(ex.test_cases) ? ex.test_cases : [];
  const totalTests = tests.length || 1;
  const subs = submissionsByExercise[ex.id] || [];

  // Get all class members (for "not submitted" count)
  const clsTeams = teams.filter(t => t.class_id === ex.class_id);
  const classTeamIds = new Set(clsTeams.map(t => t.id));
  const classMembers = new Set();
  teamMembers.forEach(m => { if (classTeamIds.has(m.team_id)) classMembers.add(m.display_name); });
  cells.filter(c => c.class_id === ex.class_id && c.author_name).forEach(c => classMembers.add(c.author_name));

  const correct = subs.filter(s => s.status === 'correct').length;
  const partial = subs.filter(s => s.status === 'partial').length;
  const wrong = subs.filter(s => s.status === 'wrong' || s.status === 'error').length;
  const notSubmitted = [...classMembers].filter(n => !subs.some(s => s.author_name === n)).length;
  const totalMembers = classMembers.size;

  const pctCorrect = totalMembers > 0 ? Math.round((correct / totalMembers) * 100) : 0;
  const pctPartial = totalMembers > 0 ? Math.round((partial / totalMembers) * 100) : 0;
  const pctWrong = totalMembers > 0 ? Math.round((wrong / totalMembers) * 100) : 0;
  const pctPending = Math.max(0, 100 - pctCorrect - pctPartial - pctWrong);

  return `
    <div class="ex-card" data-exercise-id="${ex.id}">
      <h3>📝 ${escapeHtml(ex.title)}</h3>
      ${ex.description ? `<div class="desc">${escapeHtml(ex.description)}</div>` : ''}

      <div class="ex-meta">
        <span class="ex-chip">${totalTests} تست‌کیس</span>
        <span>${fmtRelative(ex.created_at)}</span>
      </div>

      <div class="ex-stats-row">
        <div class="ex-stat"><div class="num total">${totalMembers}</div><div class="label">دانشجو</div></div>
        <div class="ex-stat"><div class="num correct">${correct}</div><div class="label">کامل</div></div>
        <div class="ex-stat"><div class="num partial">${partial}</div><div class="label">ناقص</div></div>
        <div class="ex-stat"><div class="num wrong">${wrong}</div><div class="label">ناموفق</div></div>
      </div>

      <div class="ex-progress">
        <div class="bar-correct" style="width:${pctCorrect}%"></div>
        <div class="bar-partial" style="width:${pctPartial}%"></div>
        <div class="bar-wrong" style="width:${pctWrong}%"></div>
        <div class="bar-pending" style="width:${pctPending}%"></div>
      </div>
      <div style="font-size:11px;color:var(--muted);text-align:left">${pctCorrect}% حل کامل · ${notSubmitted} نفر بی‌پاسخ</div>
    </div>
  `;
}

// ---------- LEADERBOARD ----------
function renderLeaderboard() {
  const stats = teams.map(t => {
    const tCells = cellsByTeam[t.id] || [];
    const completed = tCells.filter(c => {
      const out = (c.output || '').trim();
      return out && out !== '(بدون خروجی)' && !out.includes('Error') && !out.includes('Pyodide');
    }).length;
    const errors = tCells.filter(c => c.output && (c.output.includes('Error') || c.output.includes('Pyodide'))).length;
    const totalCode = tCells.reduce((sum, c) => sum + (c.code || '').length, 0);
    const memberList = membersByTeam[t.id] || [];
    const membersCount = memberList.length;

    // Exercises solved by team
    const memberNames = new Set(memberList.map(m => m.display_name));
    const teamSubs = submissions.filter(s => memberNames.has(s.author_name));
    const solvedEx = new Set();
    const exOfClass = exercises.filter(e => e.class_id === t.class_id);
    const exIdsOfClass = new Set(exOfClass.map(e => e.id));
    let totalPassed = 0;
    let totalTests = 0;
    teamSubs.forEach(s => {
      if (!exIdsOfClass.has(s.exercise_id)) return;
      totalPassed += (s.passed_tests || 0);
      totalTests += (s.total_tests || 0);
      if (s.status === 'correct') solvedEx.add(s.user_id + ':' + s.exercise_id);
    });

    return { team: t, completed, errors, totalCode, members: membersCount, cellCount: tCells.length, solvedEx: solvedEx.size, totalPassed, totalTests, classEx: exOfClass.length };
  }).filter(s => {
    if (filterSessionId && s.team.class_id !== filterSessionId) return false;
    const session = sessions.find(x => x.id === s.team.class_id);
    return matchesSearch(s.team.name, session?.title);
  }).sort((a, b) => {
    if (b.solvedEx !== a.solvedEx) return b.solvedEx - a.solvedEx;
    return b.completed - a.completed || b.totalCode - a.totalCode;
  });

  if (!stats.length) {
    return `<div class="section"><div class="empty"><span class="emoji">🏆</span>هنوز تیمی برای رتبه‌بندی نیست</div></div>`;
  }

  const byClass = {};
  stats.forEach(s => {
    const cid = s.team.class_id;
    if (!byClass[cid]) byClass[cid] = [];
    byClass[cid].push(s);
  });

  let globalRank = 0;
  const classBlocks = Object.entries(byClass).map(([cid, list]) => {
    const s = sessions.find(x => x.id === cid);
    const hasExercises = list.some(x => x.classEx > 0);
    const maxCompleted = Math.max(1, ...list.map(x => x.completed));
    const rows = list.map((st) => {
      globalRank++;
      const rank = globalRank;
      const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : `#${rank}`;
      const rankCls = rank === 1 ? 'gold' : rank === 2 ? 'silver' : rank === 3 ? 'bronze' : '';
      const color = st.team.color || colorOf(st.team.name);
      const pct = Math.round((st.completed / maxCompleted) * 100);
      return `
        <div class="lb-row" data-team-id="${st.team.id}">
          <div class="lb-rank ${rankCls}">${medal}</div>
          <div class="lb-body">
            <div class="lb-title">
              <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${color}"></span>
              ${escapeHtml(st.team.name)}
            </div>
            <div class="lb-sub">${st.members} عضو · ${st.cellCount} سلول${hasExercises ? ` · ${st.solvedEx}/${st.classEx} تمرین` : ''}</div>
            <div class="lb-bar"><div class="lb-bar-fill" style="width:${pct}%"></div></div>
          </div>
          <div class="lb-score">${hasExercises ? st.solvedEx : st.completed}</div>
        </div>`;
    }).join('');
    return `<div class="class-group">
      <div class="class-group-head">
        <span class="code-chip">${escapeHtml(s?.code || '—')}</span>
        <span class="name">${escapeHtml(s?.title || 'بدون نام')}</span>
        <span class="count-badge">${list.length} تیم</span>
      </div>
      ${rows}
    </div>`;
  }).join('');

  return `<div class="section">
    <h2>🏆 جدول امتیازات <span class="count">${stats.length} تیم</span></h2>
    <div style="font-size:11px;color:var(--muted);margin-bottom:10px">مرتب‌سازی: اول تعداد تمرین‌های کامل حل‌شده، بعد سلول‌های تکمیل‌شده</div>
    ${classBlocks}
  </div>`;
}

// ---------- ACTIVITY ----------
function renderActivity() {
  const recentCells = cells.filter(c => !filterSessionId || c.class_id === filterSessionId).map(c => ({
    type: 'cell', id: c.id, author: c.author_name, team: c.team_name,
    class: sessions.find(x => x.id === c.class_id), when: c.updated_at || c.created_at,
    hasCode: c.code && c.code.trim(), hasErr: c.output && (c.output.includes('Error') || c.output.includes('Pyodide')),
    codeLen: (c.code || '').length
  }));
  const recentSubs = submissions.filter(s => {
    if (!filterSessionId) return true;
    const ex = exercises.find(e => e.id === s.exercise_id);
    return ex && ex.class_id === filterSessionId;
  }).map(s => {
    const ex = exercises.find(e => e.id === s.exercise_id);
    return {
      type: 'submission', id: s.id, author: s.author_name,
      class: ex ? sessions.find(x => x.id === ex.class_id) : null,
      exTitle: ex?.title || '—', status: s.status, score: s.score || 0,
      passed: s.passed_tests || 0, total: s.total_tests || 0,
      when: s.submitted_at
    };
  });

  const all = [...recentCells, ...recentSubs]
    .sort((a, b) => new Date(b.when) - new Date(a.when))
    .slice(0, 40);

  if (!all.length) {
    return `<div class="section"><div class="empty"><span class="emoji">📡</span>هنوز فعالیتی ثبت نشده</div></div>`;
  }

  const rows = all.map(it => {
    if (it.type === 'cell') {
      const dotColor = it.hasErr ? 'var(--danger)' : (it.hasCode ? 'var(--success)' : 'var(--muted)');
      return `<div class="activity-item" data-cell-id="${it.id}">
        <span class="activity-dot" style="background:${dotColor};box-shadow:0 0 0 4px ${it.hasErr ? 'rgba(239,68,68,.15)' : it.hasCode ? 'rgba(16,185,129,.15)' : 'rgba(148,163,184,.15)'}"></span>
        <div style="flex:1;min-width:0">
          <div>
            <span class="activity-author">${escapeHtml(it.author || 'ناشناس')}</span>
            ${it.team ? ` در تیم <b>${escapeHtml(it.team)}</b>` : ' (سلول شخصی)'}
            ${it.class ? ` — کلاس ${escapeHtml(it.class.title)}` : ''}
          </div>
          <div style="color:var(--muted);font-size:11px;margin-top:2px">
            ${it.hasCode ? `${it.codeLen} کاراکتر کد` : 'بدون کد'} ${it.hasErr ? '• خطا' : ''}
          </div>
        </div>
        <div class="activity-time">${fmtRelative(it.when)}</div>
      </div>`;
    } else {
      const dotColor = it.status === 'correct' ? 'var(--success)' : it.status === 'partial' ? 'var(--warning)' : 'var(--danger)';
      return `<div class="activity-item" data-ex-sub="${it.id}">
        <span class="activity-dot" style="background:${dotColor};box-shadow:0 0 0 4px ${it.status === 'correct' ? 'rgba(16,185,129,.15)' : 'rgba(239,68,68,.15)'}"></span>
        <div style="flex:1;min-width:0">
          <div>
            <span class="activity-author">${escapeHtml(it.author || 'ناشناس')}</span>
            تمرین <b>${escapeHtml(it.exTitle)}</b> رو ${it.status === 'correct' ? 'کامل حل کرد' : it.status === 'partial' ? 'ناقص حل کرد' : 'اشتباه حل کرد'}
            ${it.class ? ` — کلاس ${escapeHtml(it.class.title)}` : ''}
          </div>
          <div style="color:var(--muted);font-size:11px;margin-top:2px">
            ${it.passed}/${it.total} تست پاس · امتیاز ${it.score}
          </div>
        </div>
        <div class="activity-time">${fmtRelative(it.when)}</div>
      </div>`;
    }
  }).join('');

  return `<div class="section">
    <h2>📡 آخرین فعالیت‌ها <span class="count">${all.length}</span></h2>
    ${rows}
  </div>`;
}

// =============== HANDLERS ===============
function bindContentHandlers() {
  document.querySelectorAll('[data-copy-code]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const code = el.getAttribute('data-copy-code');
      navigator.clipboard.writeText(code).then(() => toast('کد کپی شد: ' + code, 'ok', 2000));
    };
  });
  document.querySelectorAll('.class-card').forEach(el => {
    el.onclick = () => openClassDetail(el.getAttribute('data-class-id'));
  });
  document.querySelectorAll('[data-exercise-id]').forEach(el => {
    el.onclick = () => openExerciseDetail(el.getAttribute('data-exercise-id'));
  });
  document.querySelectorAll('[data-team-id]').forEach(el => {
    el.onclick = () => openTeamDetail(el.getAttribute('data-team-id'));
  });
  document.querySelectorAll('[data-student]').forEach(el => {
    el.onclick = () => openStudentDetail(el.getAttribute('data-student'));
  });
  document.querySelectorAll('[data-cell-id]').forEach(el => {
    el.onclick = () => openCellDetail(el.getAttribute('data-cell-id'));
  });
}

// =============== MODALS ===============
function openModal(title, bodyHtml) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('detailModal').classList.add('show');
}
function closeModal() { document.getElementById('detailModal').classList.remove('show'); }
document.getElementById('modalClose').onclick = closeModal;
document.getElementById('detailModal').addEventListener('click', (e) => {
  if (e.target.id === 'detailModal') closeModal();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

// ---------- CLASS DETAIL ----------
function openClassDetail(sessionId) {
  const s = sessions.find(x => x.id === sessionId);
  if (!s) return;
  const sTeams = teamsBySession[s.id] || [];
  const sCells = cellsBySession[s.id] || [];
  const sMembers = membersBySession[s.id] ? [...membersBySession[s.id]] : [];
  const sComments = sCells.reduce((sum, c) => sum + (commentsByCell[c.id]?.length || 0), 0);
  const sEx = exercisesByClass[s.id] || [];
  const link = `${location.origin}${location.pathname.replace(/[^/]*$/, '')}?s=${s.code}`;

  const teamsHtml = sTeams.length ? sTeams.map(t => {
    const color = t.color || colorOf(t.name);
    const memberList = membersByTeam[t.id] || [];
    const tCells = cellsByTeam[t.id] || [];
    const coderNames = new Set(tCells.map(c => c.author_name).filter(Boolean));
    const membersChips = memberList.length
      ? memberList.map(m => {
          const c = colorOf(m.display_name);
          const isCoder = coderNames.has(m.display_name);
          return `<span class="member-chip ${isCoder ? '' : 'inactive'}"><span class="dot" style="background:${c}">${escapeHtml(initials(m.display_name))}</span>${escapeHtml(m.display_name)}</span>`;
        }).join('')
      : '<span style="font-size:11px;color:var(--muted)">بدون عضو</span>';
    return `
      <div style="padding:14px 0;border-bottom:1px dashed var(--line)">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
          <span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:${color}"></span>
          <b>${escapeHtml(t.name)}</b>
          <span style="font-size:11px;color:var(--muted);margin-right:auto">${memberList.length} عضو · ${tCells.length} سلول</span>
        </div>
        <div class="member-chips">${membersChips}</div>
      </div>
    `;
  }).join('') : '<div class="empty" style="padding:20px">تیمی نیست</div>';

  const exercisesHtml = sEx.length ? sEx.map(ex => {
    const subs = submissionsByExercise[ex.id] || [];
    const correct = subs.filter(x => x.status === 'correct').length;
    const tests = (ex.test_cases || []).length;
    return `
      <div class="info-row" data-ex-open="${ex.id}" style="cursor:pointer">
        <span class="key"><b style="color:var(--ink)">📝 ${escapeHtml(ex.title)}</b></span>
        <span class="val" style="font-size:12px">
          ${correct} حل کامل · ${tests} تست
        </span>
      </div>
    `;
  }).join('') : '<div class="empty" style="padding:16px">تمرینی نیست</div>';

  const membersHtml = sMembers.length ? `
    <div class="member-chips">
      ${sMembers.map(m => {
        const c = colorOf(m);
        return `<span class="member-chip"><span class="dot" style="background:${c}">${escapeHtml(initials(m))}</span>${escapeHtml(m)}</span>`;
      }).join('')}
    </div>` : '<div class="empty" style="padding:20px">هنوز کسی عضو نشده</div>';

  const teamIds = new Set(sTeams.map(t => t.id));
  const sMemberships = teamMembers.filter(m => teamIds.has(m.team_id)).length;

  const body = `
    <div class="info-row"><span class="key">کد کلاس</span><span class="val" style="font-family:monospace;letter-spacing:2px;color:var(--primary)">${escapeHtml(s.code)}</span></div>
    <div class="info-row"><span class="key">ایجاد شده</span><span class="val">${fmtDate(s.created_at)}</span></div>
    <div class="info-row"><span class="key">تیم‌ها</span><span class="val">${sTeams.length}</span></div>
    <div class="info-row"><span class="key">اعضای تیم‌ها</span><span class="val">${sMemberships} عضویت (${sMembers.length} نفر یکتا)</span></div>
    <div class="info-row"><span class="key">سلول‌ها</span><span class="val">${sCells.length}</span></div>
    <div class="info-row"><span class="key">تمرین‌ها</span><span class="val">${sEx.length}</span></div>
    <div class="info-row"><span class="key">نظرات</span><span class="val">${sComments}</span></div>

    <div style="margin-top:20px">
      <h3 style="font-size:14px;color:var(--muted);margin-bottom:10px">🔗 لینک اشتراک</h3>
      <div style="display:flex;gap:8px">
        <input class="search-input" value="${escapeHtml(link)}" readonly style="font-family:monospace;font-size:11px;direction:ltr">
        <button class="btn btn-primary" id="copyLinkBtn">📋 کپی</button>
      </div>
    </div>

    <div style="margin-top:24px">
      <h3 style="font-size:14px;color:var(--muted);margin-bottom:10px">📝 تمرین‌های این کلاس</h3>
      ${exercisesHtml}
    </div>

    <div style="margin-top:24px">
      <h3 style="font-size:14px;color:var(--muted);margin-bottom:10px">🧑‍🤝‍🧑 تیم‌ها و اعضا</h3>
      ${teamsHtml}
    </div>

    <div style="margin-top:24px">
      <h3 style="font-size:14px;color:var(--muted);margin-bottom:10px">👥 همه دانشجوهای این کلاس</h3>
      ${membersHtml}
    </div>

    <div style="margin-top:24px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-primary" id="filterThisClassBtn">🎯 نمایش فقط این کلاس</button>
      <button class="btn" id="exportClassBtn">💾 خروجی JSON این کلاس</button>
    </div>
  `;
  openModal('📚 ' + (s.title || 'بدون نام'), body);

  setTimeout(() => {
    document.getElementById('copyLinkBtn')?.addEventListener('click', () => {
      navigator.clipboard.writeText(link).then(() => toast('لینک کپی شد', 'ok'));
    });
    document.getElementById('filterThisClassBtn')?.addEventListener('click', () => {
      setFilterSession(s.id);
      closeModal();
      toast('فیلتر روی کلاس «' + (s.title || 'بدون نام') + '» اعمال شد', 'info');
    });
    document.getElementById('exportClassBtn')?.addEventListener('click', () => exportClassJSON(s.id));
    document.querySelectorAll('[data-ex-open]').forEach(el => {
      el.onclick = () => {
        closeModal();
        setTimeout(() => openExerciseDetail(el.getAttribute('data-ex-open')), 100);
      };
    });
  }, 0);
}

// ---------- EXERCISE DETAIL ----------
function openExerciseDetail(exerciseId) {
  const ex = exercises.find(e => e.id === exerciseId);
  if (!ex) return;

  const cls = sessions.find(s => s.id === ex.class_id);
  const tests = Array.isArray(ex.test_cases) ? ex.test_cases : [];
  const subs = submissionsByExercise[ex.id] || [];

  const correct = subs.filter(s => s.status === 'correct').length;
  const partial = subs.filter(s => s.status === 'partial').length;
  const wrong = subs.filter(s => s.status === 'wrong' || s.status === 'error').length;

  // Not submitted
  const clsTeams = teams.filter(t => t.class_id === ex.class_id);
  const classTeamIds = new Set(clsTeams.map(t => t.id));
  const classMembers = new Set();
  teamMembers.forEach(m => { if (classTeamIds.has(m.team_id)) classMembers.add(m.display_name); });
  cells.filter(c => c.class_id === ex.class_id && c.author_name).forEach(c => classMembers.add(c.author_name));
  const submittedNames = new Set(subs.map(s => s.author_name));
  const notSubmitted = [...classMembers].filter(n => !submittedNames.has(n));

  const testsHtml = tests.length ? tests.map((tc, i) => `
    <div class="tc-preview">
      <div class="tc-preview-head"><span class="ex-chip">تست ${i + 1}</span></div>
      <div class="tc-preview-grid">
        <div class="tc-preview-col input"><div class="label">ورودی</div><div class="value">${escapeHtml(tc.input || '(خالی)')}</div></div>
        <div class="tc-preview-col expected"><div class="label">خروجی مورد انتظار</div><div class="value">${escapeHtml(tc.expected || '(خالی)')}</div></div>
      </div>
    </div>`).join('') : '<div class="empty" style="padding:16px">تست‌کیسی تعریف نشده</div>';

  const subsHtml = subs.length ? subs.map(s => {
    const color = colorOf(s.author_name);
    const passed = s.passed_tests || 0;
    const total = s.total_tests || tests.length || 1;
    return `
      <div class="sub-row" data-sub-id="${s.id}">
        <div class="sub-avatar" style="background:${color}">${escapeHtml(initials(s.author_name))}</div>
        <div class="sub-info">
          <div class="sub-name">${escapeHtml(s.author_name)}</div>
          <div class="sub-time">${fmtRelative(s.submitted_at)} · ${passed}/${total} تست · امتیاز ${s.score || 0}</div>
        </div>
        <span class="sub-status ${s.status}">${statusLabel(s.status)}</span>
      </div>
    `;
  }).join('') : '<div class="empty" style="padding:16px">هنوز کسی پاسخی نداده</div>';

  const notSubHtml = notSubmitted.length ? `
    <h3 style="font-size:14px;color:var(--muted);margin:20px 0 10px">هنوز پاسخ نداده (${notSubmitted.length})</h3>
    <div class="member-chips">
      ${notSubmitted.map(n => {
        const c = colorOf(n);
        return `<span class="member-chip"><span class="dot" style="background:${c}">${escapeHtml(initials(n))}</span>${escapeHtml(n)}</span>`;
      }).join('')}
    </div>
  ` : '';

  const body = `
    <div class="info-row"><span class="key">کلاس</span><span class="val">${cls ? escapeHtml(cls.title) + ' <span style="font-family:monospace;font-size:11px;color:var(--primary)">(' + escapeHtml(cls.code) + ')</span>' : '—'}</span></div>
    <div class="info-row"><span class="key">ایجاد</span><span class="val">${fmtDate(ex.created_at)}</span></div>
    <div class="info-row"><span class="key">تعداد تست‌کیس</span><span class="val">${tests.length}</span></div>

    ${ex.description ? `
      <div style="margin-top:20px">
        <h3 style="font-size:14px;color:var(--muted);margin-bottom:10px">📖 توضیحات</h3>
        <div style="background:#f8fafc;border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;white-space:pre-wrap;font-size:13px;line-height:1.7;color:#1e293b">${escapeHtml(ex.description)}</div>
      </div>
    ` : ''}

    ${ex.hint ? `
      <div style="margin-top:16px">
        <h3 style="font-size:14px;color:var(--muted);margin-bottom:10px">💡 راهنمایی</h3>
        <div style="background:#eff6ff;border-right:3px solid var(--primary);border-radius:6px;padding:12px 14px;font-size:13px;color:#1e40af;line-height:1.7">${escapeHtml(ex.hint)}</div>
      </div>
    ` : ''}

    <div style="margin-top:20px">
      <h3 style="font-size:14px;color:var(--muted);margin-bottom:10px">🧪 تست‌کیس‌ها</h3>
      <div class="tc-preview-list">${testsHtml}</div>
    </div>

    <div style="margin-top:24px">
      <div class="ex-stats-row" style="background:linear-gradient(135deg,#eef2ff,#e0e7ff);border-radius:var(--radius-sm);padding:14px">
        <div class="ex-stat"><div class="num total" style="color:var(--primary)">${subs.length}</div><div class="label">پاسخ</div></div>
        <div class="ex-stat"><div class="num correct" style="color:var(--success)">${correct}</div><div class="label">کامل</div></div>
        <div class="ex-stat"><div class="num partial" style="color:var(--warning)">${partial}</div><div class="label">ناقص</div></div>
        <div class="ex-stat"><div class="num wrong" style="color:var(--danger)">${wrong}</div><div class="label">ناموفق</div></div>
      </div>
    </div>

    <div style="margin-top:20px">
      <h3 style="font-size:14px;color:var(--muted);margin-bottom:10px">👥 پاسخ‌ها (${subs.length})</h3>
      ${subsHtml}
    </div>

    ${notSubHtml}

    <div style="margin-top:24px;display:flex;gap:8px;flex-wrap:wrap">
      ${cls ? `<button class="btn btn-primary" id="filterFromExBtn">🎯 فیلتر روی کلاس «${escapeHtml(cls.title)}»</button>` : ''}
    </div>
  `;
  openModal('📝 ' + ex.title, body);

  setTimeout(() => {
    document.querySelectorAll('[data-sub-id]').forEach(el => {
      el.onclick = () => {
        const sid = el.getAttribute('data-sub-id');
        const sub = subs.find(x => x.id === sid);
        if (!sub) return;
        openSubmissionDetail(sub, ex);
      };
    });
    document.getElementById('filterFromExBtn')?.addEventListener('click', () => {
      if (!cls) return;
      setFilterSession(cls.id);
      closeModal();
      toast('فیلتر روی کلاس «' + cls.title + '» اعمال شد', 'info');
    });
  }, 0);
}

// ---------- SUBMISSION DETAIL (nested modal) ----------
